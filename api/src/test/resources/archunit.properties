# 기존 위반은 archunit_store에 기록(freeze)하고, 새로 생기는 위반만 실패로 처리한다.
freeze.store.default.path=src/test/resources/archunit_store
# store가 없을 때 새로 만들지 않는다. 규칙을 추가하거나 store를 다시 만들 때만 -Darchunit.freeze.store.default.allowStoreCreation=false로 실행한다.
freeze.store.default.allowStoreCreation=false
# 위반을 고치면 store에서 자동으로 지워진다. 변경된 store 파일도 함께 commit한다.
freeze.store.default.allowStoreUpdate=true

server:
  port: 8080
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${ACTIVE_PROFILE}

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: true
    properties:
      format_sql: true
      hibernate.hbm2ddl.auto: create

# actuator 관리
management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env, beans

# swagger
springdoc:
  packages-to-scan: com.moneymong
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs/json
    groups:
      enabled: true
  cache:
    disabled: true

# Cloud
cloud:
  ncp:
    s3:
      bucket: moneymong
      endpoint: "https://kr.object.ncloudstorage.com"
    credentials:
      access-key: ${NCP_ACCESS_KEY}
      secret-key: ${NCP_SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

# P6spy
decorator:
  datasource:
    p6spy:
      enable-logging: true

agency:
  invitation-code:
    key: ${INVITATION_CODE_KEY}

app:
  minimum:
    version: ${APP_MINIMUM_VERSION}

# 알림(FCM). credentials가 비어 있으면 실제로 보내지 않는다.
notification:
  fcm:
    # 서비스 계정 JSON을 base64로 인코딩한 값
    credentials: ${FIREBASE_CREDENTIALS:}
    # 앱이 만든 Android 알림 채널 ID와 같아야 한다.
    android-channel-id: moneymong_default
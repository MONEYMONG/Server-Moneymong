import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'base'
	id 'jacoco'
	id 'org.springframework.boot' version '3.2.0' apply false
	id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
	group = 'com.moneymong'
	version = '0.0.1'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'jacoco'
	apply plugin: 'io.spring.dependency-management'

	java {
		sourceCompatibility = '17'
	}

	dependencyManagement {
		imports {
			mavenBom SpringBootPlugin.BOM_COORDINATES
		}
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
	}

	jacoco {
		toolVersion = '0.8.11'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

// ===== JaCoCo: 전체 module의 coverage를 합쳐 70% gate를 검사한다 =====

jacoco {
	toolVersion = '0.8.11'
}

// 커버리지 측정 대상: controller, service layer만 측정한다.
// entity, dto(request/response), repository, config, 외부 API client(oauth handler, storage handler)는 제외.
def jacocoIncludes = [
		'com/moneymong/domain/*/api/*',
		'com/moneymong/domain/*/service/**',
		'com/moneymong/global/**/api/*',
		'com/moneymong/global/**/service/*',
		'com/moneymong/global/applink/*Controller*',
		'com/moneymong/global/version/VersionController*',
]

// service 패키지 아래로 옮긴 request/response DTO는 측정에서 제외한다.
def jacocoExcludes = [
		'com/moneymong/**/service/dto/**',
]

def jacocoClassDirs = {
	files(subprojects.collect { p ->
		p.sourceSets.main.output.classesDirs.collect {
			fileTree(dir: it, includes: jacocoIncludes, excludes: jacocoExcludes)
		}
	})
}

def configureAggregatedJacoco = { task ->
	task.dependsOn subprojects.collect { it.tasks.named('test') }
	task.executionData.setFrom(files(subprojects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
			.filter { it.exists() })
	task.classDirectories.setFrom(jacocoClassDirs())
	task.sourceDirectories.setFrom(files(subprojects.collect { it.sourceSets.main.java.srcDirs }))
}

tasks.register('jacocoTestReport', JacocoReport) { task ->
	configureAggregatedJacoco(task)
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) { task ->
	configureAggregatedJacoco(task)
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

subprojects {
	tasks.named('test') {
		finalizedBy rootProject.tasks.named('jacocoTestReport')
	}
}

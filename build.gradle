plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'jacoco'
}

group = 'com.moneymong'
version = '0.0.1'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// jpa + mysql
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.75'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.75'
	implementation "com.auth0:java-jwt:4.4.0"

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

	// Cloud
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

	// 기타
	implementation platform("com.fasterxml.jackson:jackson-bom:2.14.0")
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// QueryDSL
	implementation "com.querydsl:querydsl-jpa:5.0.0:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// P6spy
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

	// redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// 패키지 의존 규칙 검사
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

jacoco {
	toolVersion = '0.8.11'
}

// 커버리지 측정 대상: controller, service layer만 측정한다.
// entity, dto(request/response), repository, config, 외부 API client(oauth handler, storage handler)는 제외.
def jacocoIncludes = [
		'com/moneymong/domain/*/api/*',
		'com/moneymong/domain/*/service/**',
		'com/moneymong/global/**/api/*',
		'com/moneymong/global/**/service/*',
		'com/moneymong/global/applink/*Controller*',
		'com/moneymong/global/version/VersionController*',
]

def jacocoClassDirs = {
	files(sourceSets.main.output.classesDirs.collect {
		fileTree(dir: it, includes: jacocoIncludes)
	})
}

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	classDirectories.setFrom(jacocoClassDirs())
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'test'
	classDirectories.setFrom(jacocoClassDirs())
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDir querydslDir
}

clean {
	delete file("${querydslDir}")
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

tasks.withType(JavaCompile).configureEach {
	clean
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

name: deploy to dev

on:
  push:
    branches:
      - dev

# 권한 설정
permissions:
  contents: read

# 같은 환경 배포가 동시에 실행되면 server 컨테이너 교체가 서로 충돌하므로 순차 실행한다.
# 진행 중인 배포는 취소하지 않고, 다음 배포는 앞 배포가 끝날 때까지 대기한다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  CI-CD:
    runs-on: ubuntu-latest

    steps:
      # JDK 설정
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 환경 변수 설정
      - name: Set up Environment
        run: echo "${{ secrets.ENV_PROPERTIES_DEV }}" > ./.env

      # 환경 변수 파일 서버로 전달
      - name: Send env file
        uses: appleboy/scp-action@master
        with:
          username: root
          host: ${{ secrets.AWS_DEV_IP }}
          password: ${{ secrets.AWS_DEV_PASSWORD }}
          source: "./.env"
          target: "/root"

      # 빌드
      - name: Build with Gradle
        run: ./gradlew clean bootJar

      # 빌드 후 도커 허브로 push
      - name: Docker Build & Push to Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }} -f ./.docker/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}

      # 도커 컴포즈 설정 파일 서버로 전달하기(복사 후 붙여넣기)
      - name: Send docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          username: root
          host: ${{ secrets.AWS_DEV_IP }}
          password: ${{ secrets.AWS_DEV_PASSWORD }}
          port: 22
          source: "./.docker/docker-compose.dev.yml"
          target: "/root"

      # 도커 컴포즈 실행
      - name: Deploy to Dev
        uses: appleboy/ssh-action@master
        with:
          username: root
          host: ${{ secrets.AWS_DEV_IP }}
          password: ${{ secrets.AWS_DEV_PASSWORD }}
          script: |
            set -e
            cp /root/.docker/docker-compose.dev.yml /root/docker-compose.yml
            cd /root
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
            docker-compose stop server
            docker-compose rm -f server
            docker-compose up -d
            docker image prune -f
